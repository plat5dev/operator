# Paths this gateway forwards. The path names the target. Contract: docs/routes.md.
# Identity's public URLs, and the org audit log read. Credential-minting routes are left out on purpose.
# Addresses are the Plat5 compose network. A deployment mounts its own file.
upstreams:
  identity:
    url: http://identity:3000
    routes:
      - path: /organizations
        methods: [GET]
      - path: /organizations/{organization_id}
        methods: [GET, PATCH, DELETE]
      - path: /organizations/{organization_id}/members
        methods: [GET, POST]
      - path: /organizations/{organization_id}/members/{member_id}
        methods: [GET, PATCH, DELETE]
      - path: /organizations/{organization_id}/roles
        methods: [GET]
      - path: /organizations/{organization_id}/invites
        methods: [GET, POST]
      - path: /organizations/{organization_id}/invites/{invite_id}
        methods: [DELETE]
      - path: /organizations/{organization_id}/service-accounts
        methods: [GET, POST]
      - path: /organizations/{organization_id}/service-accounts/{service_account_id}
        methods: [GET, PATCH, DELETE]
      - path: /organizations/{organization_id}/service-accounts/{service_account_id}/api-keys
        methods: [GET]
      - path: /organizations/{organization_id}/service-accounts/{service_account_id}/api-keys/{key_id}
        methods: [DELETE]
      - path: /members/{member_id}
        methods: [GET, PATCH, DELETE]
      - path: /members/{member_id}/api-keys
        methods: [GET]
      - path: /members/{member_id}/api-keys/{key_id}
        methods: [DELETE]
      - path: /users/{user_id}/memberships
        methods: [GET]
      - path: /users/{user_id}/organizations
        methods: [POST]
      - path: /users/{user_id}/invites/redeem
        methods: [POST]
      - path: /users/{user_id}/api-keys
        methods: [GET]
      - path: /users/{user_id}/api-keys/{key_id}
        methods: [DELETE]
  audit:
    url: http://audit:3002
    routes:
      - path: /organizations/{organization_id}/audit-events
        methods: [GET]
