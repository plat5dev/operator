<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Operator</title>
  <style>
    body { font: 16px/1.4 ui-sans-serif, system-ui, sans-serif; margin: 2rem auto; max-width: 40rem; padding: 0 1rem; }
    label { display: block; margin-top: 0.8rem; }
    input, select, textarea { width: 100%; box-sizing: border-box; margin-top: 0.2rem; padding: 0.4rem; font: inherit; }
    textarea { font-family: ui-monospace, monospace; }
    button { margin-top: 1rem; }
    pre { white-space: pre-wrap; word-break: break-word; background: #f4f4f4; padding: 0.8rem; }
    p.msg { font-size: 1.1rem; }
  </style>
</head>
<body>
  <h1>Operator</h1>
  <form id="login">
    <label>Email <input name="email" type="email" autocomplete="username" required></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Log in</button>
  </form>
  <form id="call" hidden>
    <label>Customer user id <input name="user_id" required autocomplete="off"></label>
    <p>Not your operator login.</p>
    <label>Call <select name="call"></select></label>
    <div id="params"></div>
    <p id="org-note" hidden>Sent as X-Organization-Id. Not forwarded.</p>
    <label id="body-label" hidden>Body <textarea name="body" rows="8" spellcheck="false"></textarea></label>
    <button type="submit">Send</button>
  </form>
  <p class="msg" id="msg"></p>
  <pre id="out" hidden></pre>
  <script>
    const tokenKey = "operator_token";
    const login = document.querySelector("#login");
    const call = document.querySelector("#call");
    const msg = document.querySelector("#msg");
    const out = document.querySelector("#out");
    const params = document.querySelector("#params");
    const orgNote = document.querySelector("#org-note");
    const bodyLabel = document.querySelector("#body-label");
    const paramLabel = {
      organization_id: "Organization id",
      member_id: "Member id",
      key_id: "Key id",
      invite_id: "Invite id",
      service_account_id: "Service account id"
    };
    const calls = [
      { label: "GET /api/organizations", method: "GET", path: "/api/organizations" },
      { label: "POST /api/organizations", method: "POST", path: "/api/organizations", body: '{\n  "name": "",\n  "slug": ""\n}' },
      { label: "GET /api/organizations/{organization_id}", method: "GET", path: "/api/organizations/{organization_id}" },
      { label: "PATCH /api/organizations/{organization_id}", method: "PATCH", path: "/api/organizations/{organization_id}", body: '{\n  "name": ""\n}' },
      { label: "DELETE /api/organizations/{organization_id}", method: "DELETE", path: "/api/organizations/{organization_id}" },
      { label: "GET /api/organizations/{organization_id}/members", method: "GET", path: "/api/organizations/{organization_id}/members" },
      { label: "POST /api/organizations/{organization_id}/members", method: "POST", path: "/api/organizations/{organization_id}/members", body: '{\n  "user_id": "",\n  "role": "member"\n}' },
      { label: "GET /api/organizations/{organization_id}/members/{member_id}", method: "GET", path: "/api/organizations/{organization_id}/members/{member_id}" },
      { label: "PATCH /api/organizations/{organization_id}/members/{member_id}", method: "PATCH", path: "/api/organizations/{organization_id}/members/{member_id}", body: '{\n  "role": "member"\n}' },
      { label: "DELETE /api/organizations/{organization_id}/members/{member_id}", method: "DELETE", path: "/api/organizations/{organization_id}/members/{member_id}" },
      { label: "GET /api/organizations/{organization_id}/members/{member_id}/api-keys", method: "GET", path: "/api/organizations/{organization_id}/members/{member_id}/api-keys" },
      { label: "POST /api/organizations/{organization_id}/members/{member_id}/api-keys", method: "POST", path: "/api/organizations/{organization_id}/members/{member_id}/api-keys", body: '{\n  "name": ""\n}' },
      { label: "DELETE /api/organizations/{organization_id}/members/{member_id}/api-keys/{key_id}", method: "DELETE", path: "/api/organizations/{organization_id}/members/{member_id}/api-keys/{key_id}" },
      { label: "GET /api/organizations/{organization_id}/invites", method: "GET", path: "/api/organizations/{organization_id}/invites" },
      { label: "POST /api/organizations/{organization_id}/invites", method: "POST", path: "/api/organizations/{organization_id}/invites", body: '{\n  "role": "member",\n  "email": ""\n}' },
      { label: "DELETE /api/organizations/{organization_id}/invites/{invite_id}", method: "DELETE", path: "/api/organizations/{organization_id}/invites/{invite_id}" },
      { label: "POST /api/invites/redeem", method: "POST", path: "/api/invites/redeem", body: '{\n  "token": ""\n}' },
      { label: "GET /api/organizations/{organization_id}/service-accounts", method: "GET", path: "/api/organizations/{organization_id}/service-accounts" },
      { label: "POST /api/organizations/{organization_id}/service-accounts", method: "POST", path: "/api/organizations/{organization_id}/service-accounts", body: '{\n  "name": ""\n}' },
      { label: "GET /api/organizations/{organization_id}/service-accounts/{service_account_id}", method: "GET", path: "/api/organizations/{organization_id}/service-accounts/{service_account_id}" },
      { label: "PATCH /api/organizations/{organization_id}/service-accounts/{service_account_id}", method: "PATCH", path: "/api/organizations/{organization_id}/service-accounts/{service_account_id}", body: '{\n  "name": ""\n}' },
      { label: "DELETE /api/organizations/{organization_id}/service-accounts/{service_account_id}", method: "DELETE", path: "/api/organizations/{organization_id}/service-accounts/{service_account_id}" }
    ];
    const remembered = {};
    function show(text, raw) {
      msg.textContent = text || "";
      out.hidden = !raw;
      out.textContent = raw || "";
    }
    function selected() {
      return calls[Number(call.call.value)];
    }
    function pathParams(path) {
      return [...path.matchAll(/\{([a-z0-9_]+)\}/g)].map((m) => m[1]);
    }
    function remember() {
      for (const input of params.querySelectorAll("input")) remembered[input.name] = input.value;
    }
    function render() {
      remember();
      const chosen = selected();
      params.replaceChildren();
      for (const name of pathParams(chosen.path)) {
        const label = document.createElement("label");
        label.textContent = paramLabel[name] || name;
        const input = document.createElement("input");
        input.name = name;
        input.required = true;
        input.autocomplete = "off";
        input.value = remembered[name] || "";
        label.append(input);
        params.append(label);
      }
      orgNote.hidden = !chosen.path.includes("{organization_id}");
      bodyLabel.hidden = chosen.body == null;
      if (chosen.body != null) call.body.value = chosen.body;
    }
    for (let i = 0; i < calls.length; i++) {
      const option = document.createElement("option");
      option.value = String(i);
      option.textContent = calls[i].label;
      call.call.append(option);
    }
    call.call.addEventListener("change", render);
    render();
    if (sessionStorage.getItem(tokenKey)) {
      login.hidden = true;
      call.hidden = false;
    }
    login.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const body = {
        email: login.email.value,
        password: login.password.value
      };
      const res = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      const raw = await res.text();
      if (!res.ok) {
        let text = "Authentication required.";
        try { text = JSON.parse(raw).error.message || text; } catch (e) {}
        show(text, raw);
        return;
      }
      sessionStorage.setItem(tokenKey, JSON.parse(raw).token);
      login.hidden = true;
      call.hidden = false;
      show("", "");
    });
    call.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const chosen = selected();
      const values = {};
      for (const input of params.querySelectorAll("input")) values[input.name] = input.value.trim();
      let path = chosen.path;
      for (const name of pathParams(chosen.path)) {
        path = path.replace("{" + name + "}", encodeURIComponent(values[name]));
      }
      if (chosen.method === "DELETE" && !confirm("Send DELETE " + path + "?")) return;
      const headers = {
        Authorization: "Bearer " + sessionStorage.getItem(tokenKey),
        "X-User-Id": call.user_id.value.trim()
      };
      if (values.organization_id) headers["X-Organization-Id"] = values.organization_id;
      let payload;
      if (chosen.body != null) {
        payload = call.body.value;
        if (payload.trim() === "") {
          show("Body is required.");
          return;
        }
        try { JSON.parse(payload); } catch (e) {
          show("Body is not JSON.");
          return;
        }
        headers["Content-Type"] = "application/json";
      }
      const res = await fetch(path, { method: chosen.method, headers, body: payload });
      const raw = await res.text();
      let text = res.status + " " + (res.headers.get("X-Request-ID") || "");
      try {
        const parsed = JSON.parse(raw);
        if (parsed.error && parsed.error.message) text = parsed.error.message;
      } catch (e) {}
      show(text, raw);
    });
  </script>
</body>
</html>
