<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operator</title>
    <!-- Before paint. theme.tsx uses the same rule. -->
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("operator-theme") === "light" ? "light" : "dark"
      } catch (e) {
        document.documentElement.dataset.theme = "dark"
      }
    </script>
    <script type="importmap">
      {
        "imports": {
          "react": "/vendor/react.js",
          "react-dom": "/vendor/react-dom.js",
          "react-dom/client": "/vendor/react-dom-client.js",
          "react/jsx-runtime": "/vendor/react-jsx-runtime.js",
          "react/jsx-dev-runtime": "/vendor/react-jsx-dev-runtime.js",
          "react-router-dom": "/vendor/react-router-dom.js"
        }
      }
    </script>
  </head>
  <body>
    <script type="application/json" id="operator-modules">__MODULES__</script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
