name: ci

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    # Store and role tests need Postgres. Each test makes its own database and roles.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPERATOR_AUDIT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: format check
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: operator
            target: prod
          - image: operator-audit
            target: operator-audit
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          platforms: linux/amd64
          tags: plat5/${{ matrix.image }}:ci
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
            SOURCE=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
