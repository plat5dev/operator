# Dev routes: the shipped routes.yml, plus echo, which answers with the request it received
# so you can see what a service is sent. Keep the rest equal to routes.yml (a test checks).
services:
  identity:
    url: http://identity:3000
    routes:
      # The tree, unfiltered: ?kind=, ?parent_id=, ?status=.
      - path: /nodes
        methods: [GET]
      - path: /nodes/{node_id}
        node: node_id
        methods: [GET, PATCH, DELETE]
      - path: /nodes/{node_id}/restore
        node: node_id
        methods: [POST]
      - path: /nodes/{node_id}/release-slug
        node: node_id
        methods: [POST]
      # Filtered by the member, so listed only as one. Created as one, they get creator_role.
      - path: /nodes/{node_id}/children/{kind}
        node: node_id
        as_member: true
        methods: [GET, POST]
      - path: /roots/{kind}
        methods: [POST]
      - path: /nodes/{node_id}/roles
        node: node_id
        methods: [GET]
      - path: /nodes/{node_id}/bindings
        node: node_id
        methods: [GET, POST]
      - path: /nodes/{node_id}/bindings/{binding_id}
        node: node_id
        methods: [PATCH, DELETE]
      - path: /nodes/{node_id}/access
        node: node_id
        methods: [GET]
      - path: /nodes/{root_id}/members
        node: root_id
        methods: [GET, POST]
      - path: /nodes/{root_id}/members/{member_id}
        node: root_id
        methods: [GET, DELETE]
      - path: /nodes/{node_id}/service-accounts
        node: node_id
        methods: [GET, POST]
      - path: /nodes/{node_id}/service-accounts/{member_id}
        node: node_id
        methods: [GET, PATCH, DELETE]
      - path: /nodes/{node_id}/service-accounts/{member_id}/keys
        node: node_id
        methods: [GET]
      - path: /nodes/{node_id}/service-accounts/{member_id}/keys/{key_id}
        node: node_id
        methods: [DELETE]
      - path: /nodes/{node_id}/invites
        node: node_id
        methods: [GET, POST]
      - path: /nodes/{node_id}/invites/{invite_id}
        node: node_id
        methods: [DELETE]
      # A person, by their directory member.
      - path: /members/{member_id}
        methods: [GET, DELETE]
      - path: /members/{member_id}/status
        methods: [PATCH]
      - path: /members/{member_id}/nodes
        methods: [GET]
      - path: /members/{member_id}/keys
        methods: [GET]
      - path: /members/{member_id}/keys/{key_id}
        methods: [DELETE]
      - path: /members/{member_id}/invites/redeem
        methods: [POST]
  audit:
    url: http://audit:3002
    routes:
      - path: /nodes/{node_id}/audit-events
        node: node_id
        methods: [GET]
      - path: /members/{member_id}/audit-events
        methods: [GET]
  operator-audit:
    url: http://operator-audit:5005
    routes:
      - path: /operator-audit-events
        methods: [GET]
  echo:
    url: http://echo:80
    routes:
      - path: /nodes/{node_id}/echo
        node: node_id
        as_member: true
        methods: [GET, POST]
