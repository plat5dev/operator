name: operator

volumes:
  operator_data:

networks:
  operator:
    driver: bridge

services:
  operator:
    build:
      context: ..
      dockerfile: Dockerfile
      target: prod
    labels:
      service.name: operator
      service.namespace: operator
    ports:
      - "5004:5004"
    environment:
      ADDR: ${ADDR:-:5004}
      DB_PATH: ${DB_PATH:-/data/operator.db}
      ROUTES_FILE: ${ROUTES_FILE:-/routes.yml}
      MODULES_FILE: ${MODULES_FILE:-/modules.yml}
      MODULES_DIR: ${MODULES_DIR:-/modules}
      CONSOLE_ASSETS: ${CONSOLE_ASSETS:-/console}
      OPERATOR_BOOTSTRAP_EMAIL: ${OPERATOR_BOOTSTRAP_EMAIL:-}
      OPERATOR_BOOTSTRAP_PASSWORD: ${OPERATOR_BOOTSTRAP_PASSWORD:-}
      OTEL_SERVICE_NAME: operator
      OTEL_SERVICE_NAMESPACE: operator
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      DEPLOYMENT_ENV: docker
    volumes:
      - operator_data:/data
    networks:
      - operator
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5004/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
