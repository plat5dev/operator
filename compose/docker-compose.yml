# Dev stack: gateway, Plat5 Auth as the operator IdP, an echo service, and the operator audit log
# (Postgres and operator-audit). The gateway joins Plat5's compose network to reach identity
# and audit: start Plat5 first. See README.md.
name: operator

networks:
  plat5:
    external: true
    name: ${PLAT5_NETWORK:-plat5_plat5}

services:
  operator:
    build:
      context: ..
      dockerfile: Dockerfile
      target: prod
    ports:
      - "${OPERATOR_PORT:-5410}:5004"
      - "127.0.0.1:8004:8004"
    environment:
      ROUTES_FILE: /etc/operator/routes.yml
      IDENTITY_URL: http://identity:3000
      # Plat5 Auth as the operator IdP: the operator id is its user id, and the email is
      # in the token because operator-auth sets AUTH_TOKEN_EMAIL.
      AUTH_ISSUER: http://localhost:5411
      AUTH_JWKS_URI: http://operator-auth:5000/.well-known/jwks.json
      AUTH_AUDIENCES: operator-console
      AUTH_OPERATOR_ID_CLAIM: properties.user_id
      AUTH_OPERATOR_EMAIL_CLAIM: properties.email
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5412}
      AUDIT_URL: http://operator-audit:8005
      AUDIT_TOKEN: dev-audit-token
    volumes:
      - ./routes.yml:/etc/operator/routes.yml:ro
    networks:
      - default
      - plat5
    depends_on:
      operator-auth:
        condition: service_healthy
      echo:
        condition: service_started
      operator-audit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  operator-audit:
    build:
      context: ..
      dockerfile: Dockerfile
      target: operator-audit
    command: ["serve"]
    ports:
      - "127.0.0.1:8005:8005"
    environment:
      # The writer role: it can add events and their outcomes, never change or delete one.
      DATABASE_URL: postgres://audit_writer:audit_writer@operator-postgres:5432/operator?sslmode=disable
      INTERNAL_TOKEN: dev-audit-token
    depends_on:
      operator-audit-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  operator-audit-migrate:
    build:
      context: ..
      dockerfile: Dockerfile
      target: operator-audit
    command: ["migrate"]
    environment:
      # The owner role: migrations and the writer's grants. Not used at runtime.
      DATABASE_URL: postgres://audit_owner:audit_owner@operator-postgres:5432/operator?sslmode=disable
      WRITER_ROLE: audit_writer
    depends_on:
      operator-postgres:
        condition: service_healthy
    restart: "no"

  operator-postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: operator
      AUDIT_OWNER_PASSWORD: audit_owner
      AUDIT_WRITER_PASSWORD: audit_writer
      OPERATOR_AUTH_DB: operator_auth
    volumes:
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-audit-roles.sh:ro
      - operator-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "operator"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The operator IdP: Plat5 Auth in dev mode, its own issuer and database. Never the
  # customer issuer (docs/reference/idp.md).
  operator-auth:
    image: ghcr.io/plat5dev/auth:${AUTH_VERSION:-v0.2.2}
    ports:
      - "5411:5000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@operator-postgres:5432/operator_auth?sslmode=disable
      INTERNAL_PORT: 5001
      PUBLIC_ISSUER_URL: http://localhost:5411
      AUTH_DISPLAY_NAME: Plat5 operator
      AUTH_ALLOWED_CLIENTS: operator-console
      AUTH_ALLOWED_REDIRECT_URIS: http://localhost:5412/callback
      AUTH_ALLOWED_ORIGINS: http://localhost:5412
      AUTH_TOKEN_EMAIL: "true"
      # Dev only: POST /dev/token, and a password login.
      AUTH_DEV_MODE: "true"
      AUTH_DEV_USERS: operator@example.com:password
    depends_on:
      operator-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:5001/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Answers with the request it received: what a service is sent (routes.yml's echo).
  echo:
    image: traefik/whoami:v1.11

volumes:
  operator-postgres:
