# Production stack: pulls ghcr.io/plat5dev/operator:${OPERATOR_VERSION}. Copy .env.template to .env.
# Build locally instead: add -f docker-compose.prod.build.yml and --build.
name: operator

services:
  operator:
    image: ghcr.io/plat5dev/operator:${OPERATOR_VERSION:?set OPERATOR_VERSION}
    ports:
      - "127.0.0.1:5004:5004"
    environment:
      ROUTES_FILE: ${ROUTES_FILE:-/routes.yml}
      AUTH_ISSUER: ${AUTH_ISSUER:?set AUTH_ISSUER}
      AUTH_JWKS_URI: ${AUTH_JWKS_URI:?set AUTH_JWKS_URI}
      AUTH_AUDIENCES: ${AUTH_AUDIENCES:?set AUTH_AUDIENCES}
      AUTH_OPERATOR_ID_CLAIM: ${AUTH_OPERATOR_ID_CLAIM:-sub}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-30000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
