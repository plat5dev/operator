# Production stack — pulls ghcr.io/plat5dev/operator:${OPERATOR_VERSION}.
# Pin: OPERATOR_VERSION (tag from this repo's v* releases, e.g. v0.2.0).
# Build locally: add -f docker-compose.prod.build.yml and --build.
name: operator

volumes:
  operator_data:

networks:
  operator:
    driver: bridge

services:
  operator:
    image: ghcr.io/plat5dev/operator:${OPERATOR_VERSION:-v0.2.0}
    labels:
      service.name: operator
      service.namespace: operator
    ports:
      - "5004:5004"
    environment:
      ADDR: ${ADDR:-:5004}
      DB_PATH: ${DB_PATH:-/data/operator.db}
      ROUTES_FILE: ${ROUTES_FILE:-/routes.yml}
      CONSOLE_ASSETS: ${CONSOLE_ASSETS:-/console}
      OPERATOR_BOOTSTRAP_EMAIL: ${OPERATOR_BOOTSTRAP_EMAIL:-}
      OPERATOR_BOOTSTRAP_PASSWORD: ${OPERATOR_BOOTSTRAP_PASSWORD:-}
      OTEL_SERVICE_NAME: operator
      OTEL_SERVICE_NAMESPACE: operator
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      DEPLOYMENT_ENV: prod
    volumes:
      - operator_data:/data
    networks:
      - operator
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5004/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
